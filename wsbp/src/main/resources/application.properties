### Wicket\u306E\u8A2D\u5B9A
## \u8D77\u52D5\u30E2\u30FC\u30C9\uFF08development:\u958B\u767A deployment:\u904B\u7528\uFF09
wicket.core.settings.general.configuration-type=development

## \u6587\u5B57\u30B3\u30FC\u30C9
wicket.core.settings.requestcycle.response-request-encoding=UTF-8
wicket.core.settings.markup.default-markup-encoding=UTF-8

## WicketSfuff Annotations\u306E\u5229\u7528
wicket.stuff.annotationscan.enabled=true

## WicketSfuff Annotations\u306E\u5BFE\u8C61\u30D1\u30C3\u30B1\u30FC\u30B8
wicket.stuff.annotationscan.packagename=com.example.wsbp.page

## SpringSecurity\u3092\u4F7F\u3046
wicket.external.spring.security=true

## Spring\u306E\u8A2D\u5B9A
server.servlet.session.tracking-modes=COOKIE

## JDBC\u306E\u8A2D\u5B9A
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:~/h2db/wsbp_prac;Mode=PostgreSQL;AUTO_SERVER=TRUE;
spring.datasource.username=b1992490
spring.datasource.password=qwert
spring.sql.init.mode=always

### Azure AD OAuth settings
# AZURE_AD_CLIENT_ID \u306A\u3069\u306F\u74B0\u5883\u5909\u6570\u306B\u8A2D\u5B9A\u3057\u3066\u304B\u3089\u8D77\u52D5\u3059\u308B\u3053\u3068
azure.ad.enabled=${AZURE_AD_ENABLED:false}
spring.security.oauth2.client.registration.azure.client-id=${AZURE_AD_CLIENT_ID:}
spring.security.oauth2.client.registration.azure.client-secret=${AZURE_AD_CLIENT_SECRET:}
spring.security.oauth2.client.registration.azure.client-name=Azure AD
spring.security.oauth2.client.registration.azure.provider=azure
spring.security.oauth2.client.registration.azure.scope=openid,profile,email
spring.security.oauth2.client.registration.azure.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.azure.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0
